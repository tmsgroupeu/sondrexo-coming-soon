<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#092b4c">
  <meta name="description" content="Sondrexo — General Ship Supplies in Cyprus & Greece. Our website is under development. For enquiries, email sales@sondrexo.com.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="SONDREXO | General Ship Supplies">
  <meta property="og:description" content="General Ship Supplies — Cyprus & Greece. Website under development. Contact sales@sondrexo.com.">
  <title>SONDREXO | General Ship Supplies — Cyprus & Greece</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/harbor-background.webp" type="image/webp" fetchpriority="high">
  <style>
    :root {
      --navy: #072d50;
      --navy-deep: #052442;
      --blue: #1776aa;
      --body: #0b3152;
      --serifless: "Avenir Next", "Century Gothic", "Segoe UI", Helvetica, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: #17486a; }
    body { min-width: 320px; min-height: 100vh; min-height: 100svh; margin: 0; font-family: var(--serifless); color: var(--body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    .landing { isolation: isolate; position: relative; display: grid; justify-items: center; align-items: start; min-height: 100vh; min-height: 100svh; overflow: hidden; padding: clamp(96px, 16.4vh, 170px) 22px 80px; }
    .scene { position: absolute; inset: -3.5%; z-index: -3; pointer-events: none; background-image: url("assets/harbor-background.webp"); background-size: cover; background-position: center center; animation: ambient-drift 32s ease-in-out infinite alternate; will-change: transform; }
    .ambient-light { position: absolute; inset: 0; z-index: -2; pointer-events: none; background: radial-gradient(ellipse 50% 47% at 56% 37%, rgba(255,255,255,.10), transparent 83%), linear-gradient(to bottom, rgba(4,39,70,.08), rgba(255,255,255,.03) 42%, transparent 75%); animation: breathe 15s ease-in-out infinite alternate; }
    .landing::after { content:""; pointer-events:none; position:absolute; inset:0; z-index:-1; box-shadow: inset 0 0 120px rgba(5,35,59,.07); }
    .content { width: min(100%, 780px); display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
    .branding { display:flex; flex-direction:column; align-items:center; width:100%; }
    .wordmark { display: flex; align-items: center; justify-content:center; width: 100%; gap: .006em; white-space: nowrap; line-height: .95; color: var(--navy-deep); font-size: clamp(54px, 6.2vw, 92px); font-weight: 400; letter-spacing: -.045em; }
    .wordmark-text { display:inline-block; }
    .o-mark { height: .91em; width: .91em; flex:none; display:block; margin-left: -.005em; transform: translateY(.025em); }
    .descriptor { margin: 17px 0 0; font-size: clamp(12px, 1.36vw, 21px); font-weight:400; letter-spacing: .40em; line-height:1.45; padding-left: .4em; white-space:nowrap; }
    .separator { display:block; width:90px; height:1px; margin: 20px auto 18px; background:linear-gradient(to right, transparent, rgba(14,72,110,.65) 16%, rgba(14,72,110,.65) 84%, transparent); }
    .location { margin: 0; font-size: clamp(10px, .95vw, 15px); font-weight: 500; letter-spacing: .46em; padding-left:.46em; line-height:1.6; }
    .message { margin-top: clamp(45px, 5.4vh, 60px); }
    h1 { margin:0; font-size:clamp(31px, 3.5vw, 52px); font-weight: 350; line-height:1.19; letter-spacing:.075em; }
    h1 span { display:block; }
    .intro { font-size: clamp(15px, 1.55vw, 22px); font-weight:400; line-height:1.5; margin: 20px 0 30px; letter-spacing:.012em; }
    .contact-link { display:inline-flex; align-items:center; justify-content:center; gap: 22px; min-height: 74px; min-width: 414px; padding: 16px 32px; border-radius: 11px; background: linear-gradient(115deg, #002747, #072f55 70%, #0c426a); color:white; text-decoration:none; box-shadow: 0 10px 26px rgba(0, 32, 60, .14); border:1px solid rgba(255,255,255,.08); transition:transform .25s ease, box-shadow .25s ease, background .25s ease; }
    .contact-link:hover { transform:translateY(-3px); box-shadow:0 16px 34px rgba(0,32,60,.27); background:linear-gradient(115deg, #043a63, #0b416e); }
    .contact-link:focus-visible { outline:3px solid #fff; outline-offset:4px; }
    .mail-icon { width:31px; height:31px; stroke:currentColor; stroke-width:1.65; fill:none; flex:none; }
    .contact-divider { height:32px; width:1px; background: rgba(255,255,255,.58); }
    .email-text { font-size:clamp(15px, 1.47vw, 21px); font-weight:400; letter-spacing:.01em; white-space:nowrap; }
    @keyframes ambient-drift { from {transform:scale(1) translate3d(-.35%,0,0);} to {transform:scale(1.045) translate3d(.35%,-.25%,0);} }
    @keyframes breathe { from {opacity:.28;} to {opacity:.85;} }
    @media (min-width: 1600px) { .landing { padding-top:clamp(135px, 17vh, 220px); } }
    @media (max-width: 900px) { .landing {padding-top:clamp(112px, 16vh, 160px);} .wordmark{font-size:clamp(51px,8vw,78px);} h1{font-size:clamp(34px,5.2vw,50px);} .scene{background-position:52% center;} }
    @media (max-width: 600px) {
      .landing { min-height: 100svh; padding: max(90px, 13svh) 22px 60px; }
      .scene { inset:-6%; background-position: 76% center; }
      .ambient-light { background:linear-gradient(to bottom, rgba(220,234,245,.46) 0%, rgba(245,240,229,.56) 47%, rgba(255,246,232,.16) 80%, transparent); }
      .wordmark { font-size:clamp(43px, 10.8vw, 66px); letter-spacing:-.048em; }
      .descriptor { margin-top:12px; font-size:clamp(9px,2.6vw,13px); letter-spacing:.29em; padding-left:.29em; }
      .separator { margin:15px auto 14px; width:64px; }
      .location { font-size:clamp(9px,2.2vw,12px); letter-spacing:.28em; padding-left:.28em; }
      .message { margin-top: clamp(48px, 8vh, 88px); }
      h1 {font-size: clamp(29px,7.5vw,42px); letter-spacing:.045em; line-height:1.23; }
      .intro {font-size:clamp(14px,3.8vw,17px); margin: 16px 0 25px; max-width:340px;}
      .contact-link {width:100%; min-width:0; max-width:380px; min-height:64px; gap:14px; padding:14px 16px; border-radius:9px; }
      .mail-icon {width:25px;height:25px;}
      .contact-divider {height:25px;}
      .email-text {font-size:clamp(14px,3.85vw,18px);}
    }
    @media (max-width: 360px) { .wordmark{font-size:40px;} .descriptor{letter-spacing:.22em;} h1{font-size:27px;} }
    @media (max-height: 720px) and (min-width: 601px) { .landing{padding-top:clamp(45px,10vh,95px); padding-bottom:35px;} .message{margin-top:34px;} .intro{margin:12px 0 22px;} .contact-link{min-height:61px;} }
    @media (max-height: 680px) and (max-width: 600px) { .landing{padding-top:52px;} .message{margin-top:28px;} }
    @media (prefers-reduced-motion: reduce) { .scene,.ambient-light{animation:none!important;will-change:auto;} *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;} }
  </style>
</head>
<body>
  <main class="landing" aria-labelledby="status-title">
    <div class="scene" aria-hidden="true"></div>
    <div class="ambient-light" aria-hidden="true"></div>
    <div class="content">
      <header class="branding" aria-label="Sondrexo, General Ship Supplies, Cyprus and Greece">
        <div class="wordmark" aria-label="SONDREXO" role="img">
          <span class="wordmark-text" aria-hidden="true">SONDREX</span>
          <svg class="o-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <defs><clipPath id="o-clip"><circle cx="50" cy="50" r="41"/></clipPath></defs>
            <circle cx="50" cy="50" r="35.5" fill="none" stroke="#052442" stroke-width="10"/>
            <g clip-path="url(#o-clip)"><path d="M-6 62 C 19 40, 34 86, 59 62 C 78 44, 90 49, 108 37" fill="none" stroke="#f4f5f3" stroke-width="17" stroke-linecap="round"/><path d="M-5 61 C19 42 33 83 59 61 C 76 47 92 47 108 38" fill="none" stroke="#2480ae" stroke-width="7" stroke-linecap="round"/></g>
          </svg>
        </div>
        <p class="descriptor">GENERAL SHIP SUPPLIES</p>
        <span class="separator" aria-hidden="true"></span>
        <p class="location">CYPRUS &amp; GREECE</p>
      </header>
      <section class="message" aria-label="Website status and contact">
        <h1 id="status-title"><span>WEBSITE UNDER</span><span>DEVELOPMENT</span></h1>
        <p class="intro">For enquiries, please contact us by email.</p>
        <a class="contact-link" href="mailto:sales@sondrexo.com" aria-label="Email Sondrexo at sales@sondrexo.com">
          <svg class="mail-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="2.5" y="6.5" width="27" height="19" rx="2.2"/><path d="m4 9 12 10 12-10"/></svg>
          <span class="contact-divider" aria-hidden="true"></span>
          <span class="email-text">sales@sondrexo.com</span>
        </a>
      </section>
    </div>
  </main>
</body>
</html>
