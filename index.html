<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#052749" />
  <meta name="description" content="Sondrexo — General Ship Supplies in Cyprus & Greece. Our website is under development. Contact us at sales@sondrexo.com." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SONDREXO | General Ship Supplies" />
  <meta property="og:description" content="General Ship Supplies — Cyprus & Greece. Our website is under development. For enquiries, email sales@sondrexo.com." />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="preload" as="image" href="assets/harbor-sunset.webp" type="image/webp" />
  <link rel="preload" as="image" href="assets/sondrexo-logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <title>SONDREXO — General Ship Supplies | Cyprus &amp; Greece</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #062447;
      --navy-deep: #022245;
      --blue: #2775a8;
      --content-width: 1050px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: #0b3552;
      color: var(--navy);
      font-family: 'Montserrat', 'Avenir Next', 'Century Gothic', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* The entire page is real HTML over a separate image, never a flat mockup. */
    .landing {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      padding: 0 24px;
      text-align: center;
    }
    .landing__photo {
      position: absolute;
      z-index: -3;
      inset: -3%;
      background-color: #1a5778;
      background-image: url('assets/harbor-sunset.webp');
      background-size: cover;
      background-position: center center;
      transform: scale(1.025);
      animation: cinematic-drift 26s ease-in-out infinite alternate;
      pointer-events: none;
    }
    /* Barely-there light balancing maintains legibility without a visible content card. */
    .landing::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 49% 44% at 50% 35%, rgba(250, 251, 252, .22), transparent 100%),
        linear-gradient(to bottom, rgba(2, 21, 42, .02) 0%, transparent 52%, rgba(2, 21, 42, .16) 100%);
      pointer-events: none;
    }
    .landing::after {
      content: '';
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(90deg, rgba(0, 36, 70, .07), transparent 36%, transparent 74%, rgba(3, 26, 49, .04));
      pointer-events: none;
    }

    .waves {
      position: absolute;
      z-index: -1;
      width: min(55vw, 810px);
      min-width: 560px;
      left: max(-200px, -14vw);
      top: 18.5%;
      opacity: .70;
      filter: blur(.15px);
      transform-origin: left center;
      animation: tidal-shift 15s ease-in-out infinite alternate;
      pointer-events: none;
    }

    main {
      position: relative;
      width: min(100%, var(--content-width));
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: clamp(118px, 15.7vh, 185px);
      padding-bottom: 115px;
    }

    .brand {
      display: block;
      width: clamp(315px, 40vw, 615px);
      max-width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 1px 6px rgba(255, 255, 255, .09));
      user-select: none;
      -webkit-user-drag: none;
    }
    .heading {
      margin: 42px 0 0;
      max-width: 740px;
      font-size: clamp(39px, 3.24vw, 53px);
      font-weight: 300;
      line-height: 1.17;
      letter-spacing: .045em;
      text-transform: uppercase;
      color: #051f41;
    }
    .heading span { display: block; }
    .subtitle {
      margin: 12px 0 0;
      font-size: clamp(16px, 1.47vw, 22px);
      line-height: 1.52;
      letter-spacing: .012em;
      font-weight: 400;
      color: #234463;
    }

    .email-button {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 26px;
      width: min(452px, 100%);
      min-height: 73px;
      margin-top: 35px;
      padding: 16px 30px 16px 34px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 13px;
      background: linear-gradient(115deg, #03294f 0%, #032449 56%, #03254a 100%);
      color: #fff;
      box-shadow: 0 11px 22px rgba(0, 27, 51, .09);
      font-size: clamp(15px, 1.34vw, 20px);
      font-weight: 400;
      letter-spacing: -.025em;
      text-decoration: none;
      transition: background .22s ease, box-shadow .22s ease, transform .22s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .email-button:hover {
      background: linear-gradient(115deg, #03406c, #032749);
      box-shadow: 0 14px 32px rgba(0, 27, 51, .22);
      transform: translateY(-2px);
    }
    .email-button:active { transform: translateY(0); }
    .email-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }
    .email-button__left {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 59px;
      height: 33px;
      padding-right: 25px;
      border-right: 1px solid rgba(255, 255, 255, .47);
    }
    .email-button__label { flex: 1; text-align: center; white-space: nowrap; }
    .email-button__arrow { display: inline-flex; flex: 0 0 26px; justify-content: center; transition: transform .22s ease; }
    .email-button:hover .email-button__arrow { transform: translateX(4px); }
    .email-button svg { display: block; width: 31px; height: 31px; }
    .email-button__arrow svg { width: 28px; height: 28px; }

    .bottom-mark {
      position: absolute;
      bottom: max(25px, env(safe-area-inset-bottom));
      left: 50%;
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 10px;
      color: rgba(255, 255, 255, .94);
      transform: translateX(-50%);
      pointer-events: none;
    }
    .mouse-icon {
      position: relative;
      width: 21px;
      height: 36px;
      border: 2px solid currentColor;
      border-radius: 15px;
    }
    .mouse-icon::after {
      content: '';
      position: absolute;
      top: 7px;
      left: 50%;
      width: 2px;
      height: 9px;
      border-radius: 5px;
      background: currentColor;
      transform: translateX(-50%);
      animation: mouse-move 2.5s ease-in-out infinite;
    }
    .bottom-mark svg { width: 18px; height: 11px; opacity: .97; }

    @keyframes cinematic-drift {
      from { transform: scale(1.035) translate3d(-.3%, 0, 0); }
      to { transform: scale(1.085) translate3d(.4%, -.45%, 0); }
    }
    @keyframes tidal-shift {
      from { transform: translate3d(-13px, -4px, 0); }
      to { transform: translate3d(18px, 7px, 0); }
    }
    @keyframes mouse-move {
      0%, 100% { transform: translate(-50%, 0); opacity: .95; }
      55% { transform: translate(-50%, 8px); opacity: .35; }
    }

    @media (min-width: 1600px) {
      .waves { top: 19%; }
      .heading { margin-top: 46px; }
    }
    @media (max-width: 900px) {
      main { padding-top: clamp(112px, 18vh, 160px); }
      .brand { width: min(83vw, 560px); }
      .heading { margin-top: 43px; font-size: clamp(36px, 5.2vw, 49px); }
      .waves { top: 21%; left: -220px; width: 650px; opacity: .50; }
    }
    @media (max-width: 600px) {
      .landing { padding-inline: 18px; }
      .landing__photo { background-position: 67% center; }
      .landing::before {
        background:
          radial-gradient(ellipse 95% 37% at 50% 37%, rgba(255, 250, 239, .43), transparent 100%),
          linear-gradient(to bottom, rgba(3, 25, 48, .10), transparent 35%, rgba(7, 28, 50, .12) 100%);
      }
      main { padding-top: clamp(132px, 19.5svh, 176px); padding-bottom: 120px; }
      .brand { width: min(100%, 410px); }
      .heading {
        margin-top: 45px;
        font-size: clamp(30px, 7.4vw, 39px);
        line-height: 1.20;
        letter-spacing: .018em;
      }
      .subtitle { margin-top: 16px; font-size: 15px; line-height: 1.6; max-width: 330px; }
      .email-button {
        width: min(100%, 375px);
        min-height: 67px;
        margin-top: 29px;
        gap: 12px;
        padding: 13px 17px;
        border-radius: 12px;
        font-size: clamp(14px, 4vw, 17px);
      }
      .email-button__left { flex-basis: 41px; padding-right: 14px; }
      .email-button__left svg { width: 26px; height: 26px; }
      .email-button__arrow { flex-basis: 20px; }
      .email-button__arrow svg { width: 23px; height: 23px; }
      .waves { top: 24%; left: -276px; width: 570px; opacity: .34; }
      .bottom-mark { bottom: max(27px, env(safe-area-inset-bottom)); }
    }
    @media (max-width: 365px) {
      .landing { padding-inline: 14px; }
      .brand { width: 100%; }
      .heading { font-size: 29px; }
      .email-button { gap: 7px; padding-inline: 14px; }
      .email-button__label { font-size: 14px; }
    }
    /* Short landscape screens should remain usable instead of clipping the CTA. */
    @media (max-height: 720px) and (min-width: 601px) {
      main { padding-top: 65px; padding-bottom: 75px; }
      .brand { width: min(485px, 55vw); }
      .heading { margin-top: 22px; font-size: clamp(31px, 4vh, 43px); }
      .email-button { margin-top: 18px; min-height: 61px; }
      .bottom-mark { bottom: 14px; transform: translateX(-50%) scale(.75); }
    }
    @media (max-height: 690px) and (max-width: 600px) {
      main { padding-top: 54px; padding-bottom: 95px; }
      .brand { width: min(340px, 91vw); }
      .heading { margin-top: 22px; font-size: 29px; }
      .subtitle { margin-top: 10px; }
      .email-button { margin-top: 17px; min-height: 61px; }
      .bottom-mark { bottom: 12px; transform: translateX(-50%) scale(.80); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="landing">
    <div class="landing__photo" aria-hidden="true"></div>

    <!-- Three soft, brand-inspired waves echo the reference design. -->
    <svg class="waves" viewBox="0 0 760 390" fill="none" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="wave1" x1="0" y1="40" x2="730" y2="260" gradientUnits="userSpaceOnUse">
          <stop stop-color="#b8e9fb" stop-opacity=".74" />
          <stop offset=".56" stop-color="#d7efff" stop-opacity=".35" />
          <stop offset="1" stop-color="#e8f6ff" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="wave2" x1="0" y1="80" x2="700" y2="345" gradientUnits="userSpaceOnUse">
          <stop stop-color="#d0eeff" stop-opacity=".72" />
          <stop offset=".65" stop-color="#e7f7ff" stop-opacity=".25" />
          <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path d="M-95 145C80 145 140 12 318 10C500 8 554 180 755 165L755 221C537 238 478 79 316 79C156 80 82 219-95 220Z" fill="url(#wave1)" />
      <path d="M-102 240C80 237 151 103 325 104C502 105 570 247 758 237L758 287C545 306 488 163 326 165C159 168 88 309-102 307Z" fill="url(#wave2)" />
      <path d="M-117 322C95 320 147 190 325 188C521 186 560 321 762 310L762 349C552 363 490 240 326 240C160 240 96 378-117 378Z" fill="url(#wave1)" opacity=".58" />
    </svg>

    <main id="main-content">
      <img class="brand" src="assets/sondrexo-logo.png" width="1389" height="354"
           alt="Sondrexo — General Ship Supplies — Cyprus and Greece" decoding="async" fetchpriority="high" />

      <h1 class="heading"><span>Website Under</span><span>Development</span></h1>
      <p class="subtitle">For enquiries, please contact us by email.</p>

      <a class="email-button" href="mailto:sales@sondrexo.com" aria-label="Email Sondrexo at sales@sondrexo.com">
        <span class="email-button__left" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="6.7" width="27" height="19.2" rx="1.9" />
            <path d="M3.3 8.2L16 18.2L28.7 8.2" />
          </svg>
        </span>
        <span class="email-button__label">sales@sondrexo.com</span>
        <span class="email-button__arrow" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 16H27M19 8.5L27 16L19 23.5" />
          </svg>
        </span>
      </a>
    </main>

    <div class="bottom-mark" aria-hidden="true">
      <div class="mouse-icon"></div>
      <svg viewBox="0 0 22 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3.5L11 10L19 3.5"/></svg>
    </div>
  </div>
</body>
</html>
